<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #lockScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url("./bg.jpg") no-repeat;
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
        }

        body {
            background: url("./bg.jpg") repeat-y;
            background-size: 100vw auto;
            min-height: 3000px;
            overflow-x: hidden;
            position: relative;
            z-index: 0;
        }

        .snowflake,
        .snow-dot {
            position: fixed;
            top: -40px;
            color: #ffffff;
            z-index: 998;
            pointer-events: none;
            opacity: 0;
            animation: fall linear infinite;
            text-shadow: 0 0 7px rgba(255, 255, 255, 1);
        }
        .show-snow .snowflake,
        .show-snow .snow-dot {
            opacity: 0.9;
        }
        .snowflake.big {
            font-size: 28px;
            animation-duration: 11s;
        }
        .snowflake.medium {
            font-size: 17px;
            animation-duration: 8s;
        }
        .snowflake.small {
            font-size: 10px;
            animation-duration: 6s;
        }
        .snow-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 9px rgba(255, 255, 255, 1);
            font-size: 0;
            animation-duration: 5s;
        }
        @keyframes fall {
            0% {
                transform: translateY(-60px) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .lock-box,
        .text-box {
            background-color: rgba(255,255,255,0.23);
            border-radius:14px;
            position: relative;
            z-index:1;
        }
        .lock-box {
            width: 85%;
            max-width:420px;
            padding:40px 30px;
            text-align:center;
        }
        .lock-box h2{
            color:#666666;
            margin-bottom:24px;
            font-weight:normal;
        }
        #pwdInput {
            padding:12px 16px;
            width:100%;
            font-size:18px;
            border-radius:8px;
            border:none;
            margin-bottom:20px;
            color:#666;
        }
        .btn{
            padding:10px 32px;
            border:none;
            border-radius:6px;
            background:#7398d8;
            color:white;
            font-size:17px;
            cursor:pointer;
            margin:0 8px;
        }
        .hint-text{
            font-size:18px;
            margin-bottom:20px;
            color:#666;
        }
        .page-input{ display:block; }
        .page-right{ display:none; }
        .page-wrong{ display:none; }

        #essayPage {
            display:none;
            position: relative;
            z-index: 1;
            padding: 120px 20px;
        }
        .text-box {
            max-width:720px;
            margin:0 auto;
            padding:45px 35px;
        }
        #essay {
            color:#666666;
            font-size:18px;
            line-height:2.1;
            position:relative;
            z-index:2;
            white-space: pre-wrap;
        }
        audio {
            position:fixed;
            bottom:8px;
            opacity:0.3;
            z-index:10;
        }
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="lock-box">
            <div class="page-input">
                <h2>请输入密码</h2>
                <input id="pwdInput" type="password" placeholder="请输入密码">
                <button class="btn" id="checkBtn">确认</button>
            </div>
            <div class="page-right">
                <div class="hint-text">密码正确</div>
                <button class="btn" id="nextBtn">下一页</button>
            </div>
            <div class="page-wrong">
                <div class="hint-text">密码错误</div>
                <button class="btn" id="reInputBtn">重新输入</button>
            </div>
        </div>
    </div>

    <div id="essayPage">
        <div class="text-box">
            <div id="essay"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="./music03.mp3" type="audio/mpeg">

const typeSpeed = 39;

function createSnow(){
    const sizes = ["big", "medium", "small"];
    for(let i = 0; i < 18; i++){
        let snow = document.createElement('div');
        snow.classList.add('snowflake');
        snow.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);
        snow.innerHTML = "❄";
        snow.style.left = Math.random() * 100 + "vw";
        snow.style.animationDuration = (Math.random() * 6 + 5) + "s";
        snow.style.animationDelay = Math.random() * 8 + "s";
        document.body.appendChild(snow);
    }
    for(let i = 0; i < 14; i++){
        let dot = document.createElement('div');
        dot.classList.add('snow-dot');
        dot.style.left = Math.random() * 100 + "vw";
        dot.style.animationDuration = (Math.random() * 4 + 3) + "s";
        dot.style.animationDelay = Math.random() * 6 + "s";
        document.body.appendChild(dot);
    }
}
createSnow();

function typeWriter(){
    const el = document.getElementById("essay");
    let index = 0;
    el.textContent = "";
    function write(){
        if(index < fullText.length){
            el.textContent += fullText.charAt(index);
            index++;
            setTimeout(write,typeSpeed);
        }
    }
    write();
}

const lockScreen = document.getElementById("lockScreen");
const essayPage = document.getElementById("essayPage");
const pwdInput = document.getElementById("pwdInput");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");
const reInputBtn = document.getElementById("reInputBtn");
const bgMusic = document.getElementById("bgMusic");

const pageInput = document.querySelector('.page-input');
const pageRight = document.querySelector('.page-right');
const pageWrong = document.querySelector('.page-wrong');

function resetLockPage(){
    pageInput.style.display = "block";
    pageRight.style.display = "none";
    pageWrong.style.display = "none";
    pwdInput.value = "";
}

checkBtn.onclick = function(){
    if(pwdInput.value === correctPassword){
        pageInput.style.display = "none";
        pageRight.style.display = "block";
    }else{
        pageInput.style.display = "none";
        pageWrong.style.display = "block";
    }
}
pwdInput.addEventListener("keydown",e=>{
    if(e.key === "Enter") checkBtn.click();
})

nextBtn.onclick = function(){
    lockScreen.style.display = "none";
    essayPage.style.display = "block";
    document.body.classList.add('show-snow');
    typeWriter();
    bgMusic.play().catch(err=>console.log("浏览器交互播放音频"));
}

reInputBtn.onclick = resetLockPage;
</script>
</body>
</html>
